[flake8]
max-line-length = 127
max-complexity = 10
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    build,
    dist,
    .eggs,
    *.egg-info,
    node_modules,
    frontend/node_modules,
    .pytest_cache,
    htmlcov
ignore = E203, E266, E501, W503

[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
exclude = (\.venv|venv|env|node_modules|frontend/node_modules|__pycache__|\.pytest_cache|htmlcov)

[isort]
profile = black
line_length = 127
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip =
    venv,
    .venv,
    env,
    node_modules,
    frontend/node_modules,
    __pycache__,
    .pytest_cache,
    htmlcov

[coverage:run]
source = backend
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[tool.black]
line-length = 88
target-version = py310, py311, py312, py313
exclude = (\.venv|venv|env|node_modules|frontend/node_modules|__pycache__|\.pytest_cache|htmlcov)
