[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
exclude = '''
(
  \.venv
  | venv
  | env
  | node_modules
  | frontend/node_modules
  | __pycache__
  | \.pytest_cache
  | htmlcov
)
'''

[tool.isort]
profile = "black"
line_length = 88
skip = ["venv", ".venv", "env", "node_modules", "frontend/node_modules", "__pycache__", ".pytest_cache", "htmlcov"]

[tool.flake8]
max-line-length = 88
exclude = ".venv,venv,env,node_modules,frontend/node_modules,__pycache__,.pytest_cache,htmlcov"
ignore = "E203, W503"

[tool.mypy]
python_version = 3.11
ignore_missing_imports = true
exclude = '(\.venv|venv|env|node_modules|frontend/node_modules|__pycache__|\.pytest_cache|htmlcov)'
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
