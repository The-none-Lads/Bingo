---

version: "3.9"
services:
  backend:
    image: ghcr.io/the-none-lads/bingo-backend:latest
    environment:
      - CARD_DB_PATH=/app/data/cards.db
    volumes:
      - card-data:/app/data
    ports:
      - "19002:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/the-none-lads/bingo-frontend:latest
    environment:
      - API_BASE_URL=https://bingo.gameserver1.cc/api
      - WS_BASE_URL=ws://bingo.gameserver1.cc/api/ws
      - POLL_INTERVAL=20000
      - CARD_FETCH_INTERVAL=300000
      - GAME_ID_DEFAULT=demo
      - ENABLE_CELEBRATION=true
      - CONFETTI_DURATION=5000

    ports:
      - "19001:80"
    restart: unless-stopped

volumes:
  card-data:
