---

version: "3.9"
services:
  backend:
    image: ghcr.io/the-none-lads/bingo-backend:latest
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/the-none-lads/bingo-frontend:latest
    environment:
      - apiBaseUrl=localhost:8000
      - wsBaseUrl=ws://localhost:8000/ws
      - pollInterval=20000
      - cardFetchInterval=300000
      - gameIdDefault=demo
      - enableCelebration=true
      - confettiDuration=5000

    ports:
      - "80:80"
    restart: unless-stopped
