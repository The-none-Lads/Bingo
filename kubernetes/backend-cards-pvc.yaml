---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-card-data
  labels:
    io.kompose.service: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Generated card grids are small (a few hundred bytes each); this
      # comfortably covers many tens of thousands of cards with headroom.
      storage: 1Gi
