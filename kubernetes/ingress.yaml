---
# kubernetes/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bingo-ingress
  annotations:
    # Adjust these based on your ingress controller
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # CORS headers (backup, backend also handles this)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://bingo.yourdomain.com"

    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://bingo.youtdomain.com https://static.cloudflareinsights.com https://bingo.yourdomain.com/cdn-cgi/; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://bingo.yourdomain.com/ws; object-src 'none'; base-uri 'self';" always;
      

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bingo.yourdomain.com
      secretName: bingo-tls
  rules:
    - host: bingo.yourdomain.com
      http:
        paths:
          # Backend API routes (with /api prefix)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          # WebSocket route
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          # API routes with specific urls
          - path: /games
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          - path: /cards
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          - path: /validate
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000

          # Explicit frontend static assets
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          - path: /config.js
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000

          # Frontend (catch-all for SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
