name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge safe Dependabot updates
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # This action reads PR metadata through the GitHub API. Do not check out
      # or execute code from the Dependabot branch in this privileged workflow.
      - name: Fetch Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only patch and minor updates are eligible. Major updates stay manual.
      # GitHub's native auto-merge waits for the repository's required checks.
      - name: Enable auto-merge after required checks
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.graphql(
              `mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: $mergeMethod
                }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      mergeMethod
                    }
                  }
                }
              }`,
              {
                pullRequestId: context.payload.pull_request.node_id,
                mergeMethod: "SQUASH"
              }
            );

            core.info(
              `Enabled squash auto-merge for Dependabot PR #${result.enablePullRequestAutoMerge.pullRequest.number}.`
            );
