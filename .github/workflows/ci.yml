---
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      PYTHON_DOTENV_DISABLED: "true"
      ENVIRONMENT: development
      ALLOW_REGISTRATION: "true"
      CORS_ORIGINS: "http://test,http://localhost:3000"
      CORS_ALLOW_CREDENTIALS: "true"
      CARD_DB_PATH: ":memory:"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check Python syntax and undefined names
        run: python -m flake8 backend --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run backend unit and integration tests
        run: python -m pytest backend/tests backend/integration_tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t bingo-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t bingo-frontend:ci .
