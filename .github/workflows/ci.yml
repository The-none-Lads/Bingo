name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies (if present)
        shell: bash
        run: |
          set -e
          echo "Looking for Python dependency files..."
          if [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
          if [ ! -f backend/requirements.txt ] && [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install -e .
          fi
          echo "Python install step completed."

      - name: Run pytest if tests exist
        run: python -m pytest -q

  node-tests:
    name: Node / JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install & run npm tests if package.json exists
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            echo "package.json found. Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            if npm run | grep -q ' test'; then
              echo "Running npm test..."
              npm test || ( echo "npm test failed"; exit 1 )
            else
              echo "No npm test script defined; skipping npm test."
            fi
          else
            echo "No package.json found; skipping Node.js tests."
          fi

  lint:
    name: Lint codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for linting
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Lint with flake8 (warnings only)
        run: flake8 . --exclude=node_modules,frontend/node_modules --count --statistics
        continue-on-error: true

      - name: Check formatting with black (warnings only)
        run: black --check . --exclude node_modules/ --exclude frontend/node_modules/
        continue-on-error: true

      - name: Sort imports with isort (warnings only)
        run: isort --check-only . --skip node_modules --skip frontend/node_modules
        continue-on-error: true

      - name: Type check with mypy (warnings only)
        run: mypy . --ignore-missing-imports
        continue-on-error: true

      - name: Set up Node.js 18 for linting
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend with ESLint (warnings only)
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx,.ts,.tsx
        continue-on-error: true

      - name: Lint styles with Stylelint (warnings only)
        run: |
          cd frontend
          npx stylelint "**/*.{css,scss}"
        continue-on-error: true
      
      - name: Lint markdown with markdownlint (warnings only)
        run: |
          npx markdownlint "**/*.md"
        continue-on-error: true
      
      - name: Lint YAML with yamllint (warnings only)
        run: |
          pip install yamllint
          yamllint .
        continue-on-error: true

      - name: Lint JSON with jq (warnings only)
        run: |
          find . -name '*.json' -not -path '*/node_modules/*' -exec jq empty {} \;
        continue-on-error: true

      
      - name: Lint HTML with htmlhint (warnings only)
        run: |
          cd frontend
          npx htmlhint "**/*.html"
        continue-on-error: true
      
      - name: Lint Dockerfiles with hadolint (warnings only)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
        continue-on-error: true