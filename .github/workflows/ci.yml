name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies (if present)
        shell: bash
        run: |
          set -e
          echo "Looking for Python dependency files..."
          if [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt
          fi
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          fi
          if [ ! -f backend/requirements.txt ] && [ -f pyproject.toml ]; then
            python -m pip install --upgrade pip
            pip install -e .
          fi
          echo "Python install step completed."

      - name: Run pytest if tests exist
        shell: bash
        run: |
          set -e
          if [ -d backend/tests ] || ls backend/test_*.py 2>/dev/null || ls backend/tests/*.py 2>/dev/null; then
            echo "Running pytest..."
            python -m pytest -q || ( echo "pytest failed"; exit 1 )
          else
            echo "No Python tests found; skipping pytest."
          fi

  node-tests:
    name: Node / JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install & run npm tests if package.json exists
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            echo "package.json found. Installing dependencies..."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            if npm run | grep -q ' test'; then
              echo "Running npm test..."
              npm test || ( echo "npm test failed"; exit 1 )
            else
              echo "No npm test script defined; skipping npm test."
            fi
          else
            echo "No package.json found; skipping Node.js tests."
          fi
