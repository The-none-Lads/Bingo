name: Build and Publish Backend + Frontend Images

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image names
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend:${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t $BACKEND_IMAGE .

      - name: Push backend Docker image
        run: docker push $BACKEND_IMAGE

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t $FRONTEND_IMAGE .

      - name: Push frontend Docker image
        run: docker push $FRONTEND_IMAGE
