---
name: Build and Publish Backend + Frontend Images

on:
  push:
    tags:
      - "v*"     # release tags like v1.3.5
      - "dev"    # special rolling dev tag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        run: |
          echo "IMAGE_SHA_TAG=sha-${GITHUB_SHA:0:12}" >> $GITHUB_ENV
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend:dev" >> $GITHUB_ENV
            echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:dev" >> $GITHUB_ENV
          else
            echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend:${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${GITHUB_REF_NAME}" >> $GITHUB_ENV
            # also push latest for releases
            echo "BACKEND_IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY,,}-backend:latest" >> $GITHUB_ENV
            echo "FRONTEND_IMAGE_LATEST=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:latest" >> $GITHUB_ENV
          fi

      - name: Build backend Docker image
        run: |
          backend_tags=(-t "$BACKEND_IMAGE" -t "ghcr.io/${GITHUB_REPOSITORY,,}-backend:${IMAGE_SHA_TAG}")
          if [[ -n "${BACKEND_IMAGE_LATEST:-}" ]]; then
            backend_tags+=(-t "$BACKEND_IMAGE_LATEST")
          fi
          docker build -f backend/Dockerfile "${backend_tags[@]}" .

      - name: Push backend Docker image
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}-backend:${IMAGE_SHA_TAG}"
          if [[ -n "${BACKEND_IMAGE_LATEST:-}" ]]; then
            docker push "$BACKEND_IMAGE_LATEST"
          fi

      - name: Build frontend Docker image
        run: |
          frontend_tags=(-t "$FRONTEND_IMAGE" -t "ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${IMAGE_SHA_TAG}")
          if [[ -n "${FRONTEND_IMAGE_LATEST:-}" ]]; then
            frontend_tags+=(-t "$FRONTEND_IMAGE_LATEST")
          fi
          docker build -f frontend/Dockerfile "${frontend_tags[@]}" .

      - name: Push frontend Docker image
        run: |
          docker push "$FRONTEND_IMAGE"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${IMAGE_SHA_TAG}"
          if [[ -n "${FRONTEND_IMAGE_LATEST:-}" ]]; then
            docker push "$FRONTEND_IMAGE_LATEST"
          fi
