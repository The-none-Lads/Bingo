---

name: Tests

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend \
          --count \
          --select=E9,F63,F7,F82 \
          --show-source \
          --statistics \
          --exclude=node_modules,frontend/node_modules
          # Exit-zero treats all errors as warnings
          flake8 backend \
          --count \
          --exit-zero \
          --max-complexity=10 \
          --max-line-length=127 \
          --statistics \
          --exclude=node_modules,frontend/node_modules

      - name: Check formatting with black
        run: |
          black --check backend/ . --exclude=node_modules,frontend/node_modules

      - name: Sort imports with isort
        run: |
          isort --check-only backend/ . --skip=node_modules \
          --skip=frontend/node_modules

      - name: Type check with mypy
        run: |
          mypy backend --ignore-missing-imports || true

      - name: Set up Node.js 25 for linting
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Lint frontend with ESLint
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Lint styles with Stylelint
        run: |
          cd frontend
          npx stylelint "**/*.{css,scss}"

      - name: Lint YAML with yamllint
        run: |
          pip install yamllint
          yamllint . --config-file .yamllint

      - name: Lint JSON with jq
        run: |
          find . \
          -name '*.json' \
          -not \
          -path '*/node_modules/*' \
          -exec jq empty {} \;

      - name: Lint HTML with htmlhint
        run: |
          cd frontend
          npx htmlhint "**/*.html"

      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Run tests with pytest
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            backend/htmlcov/
            backend/coverage.xml

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Start backend server
        run: |
          cd backend
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run integration tests
        run: |
          cd backend
          pytest integration_tests/ -v

      - name: Stop backend server
        if: always()
        run: |
          pkill -f uvicorn
